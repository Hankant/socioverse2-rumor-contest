<!doctype html><html lang="zh"><meta charset="utf-8"><title>SocioVerse2 实验结果</title><style>body{font:17px system-ui;max-width:1100px;margin:40px auto;color:#16324f}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid #ddd}canvas{width:100%;background:#f7fafc}a{color:#1266aa}</style><h1>政府谣言辟谣：V5 技术失败退出分支</h1><p>已完成40轮真实 MiniMax-M3 实验。582人中1人技术退出，剩余581人。这里展示已保存结果，不发起API请求。</p><p>原实验使用真实账号派生资料；仓库演示使用合成资料，两者不能当作完全相同的实验输入。技术退出不代表真实用户主动下线。</p><canvas id="chart" width="1100" height="320"></canvas><p>蓝：相信；橙：不确定；绿：不相信；灰：未判断（均仅统计未退出用户）。</p><table id="data"><thead><tr><th>轮次</th><th>剩余人数</th><th>相信</th><th>不确定</th><th>不相信</th><th>未判断</th><th>退出</th></tr></thead><tbody></tbody></table><p><a href="completed_run/metrics_history.json">完整指标</a> · <a href="completed_run/actions.jsonl">脱敏行动轨迹</a> · <a href="completed_run/provenance.json">来源与用量</a></p><script>fetch('completed_run/metrics_history.json').then(r=>r.json()).then(d=>{let rows=d.rows;let ctx=document.querySelector('canvas').getContext('2d');[['remaining_believe','#2176ae'],['remaining_uncertain','#ee8c30'],['remaining_reject','#24966c'],['remaining_unjudged','#8997a5']].forEach(([k,col])=>{ctx.beginPath();ctx.strokeStyle=col;rows.forEach((r,i)=>{let x=30+r.step/40*1040,y=290-r[k]/582*260;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()});document.querySelector('tbody').innerHTML=rows.map(r=>'<tr>'+[r.step,r.remaining_agents,r.remaining_believe,r.remaining_uncertain,r.remaining_reject,r.remaining_unjudged,r.technical_dropout_count].map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')}).catch(e=>document.body.append('请用 python scripts/serve_results.py 启动查看器。'));</script></html>
