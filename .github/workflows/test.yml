name: Offline tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/verify_results.py
      - run: python -m pytest app -q
      - run: python app/run.py --steps 3

      - run: python -m pytest app_v6 -q
      - run: python app_v6/verify_run.py research_archive/v6_tg2_completed/run

      - run: python scripts/verify_v7_results.py
      - run: python scripts/verify_showcase.py
      - run: python -m pytest tests -q
        working-directory: v7
      - run: python app_v7/local_cli.py preview
        working-directory: v7
